<div class="container">
  <ng-container *ngIf="assets$ | async as assets">

    <div class="header">
      <h2>Factory Assets Dashboard</h2>
      <span class="asset-count">{{ assets.length }} Assets</span>
    </div>

    <div class="table-card">
      <table class="assets-table">
        <thead>
          <tr>
            <th>Asset Name</th>
            <th>Type</th>
            <th>Status</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let asset of assets">
            <td>
              <div class="asset-name">{{ asset.name }}</div>
              <div class="asset-id">ID: {{ asset.id }}</div>
            </td>
            
            <td class="asset-type">{{ asset.type }}</td>
            
            <td>
              <span class="status-badge"
                    [ngClass]="{
                      'status-running': asset.status === 'RUNNING', 
                      'status-stopped': asset.status === 'STOPPED',
                      'status-alarm': asset.status === 'ALARM',
                      'status-maintenance': asset.status === 'MAINTENANCE'
                    }">
                {{ asset.status }}
              </span>
            </td>

            <td>
              <a [routerLink]="['/assets', asset.id]" class="btn-details">
                View Details
              </a>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
    
    <div *ngIf="assets.length === 0" class="empty-state">
      No assets found in the system.
    </div>

  </ng-container>
</div>
